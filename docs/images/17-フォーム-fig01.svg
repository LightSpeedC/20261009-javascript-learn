<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 170" width="880" height="170" role="img" aria-label="フォームの送信を受け取る流れ" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">
<defs>
<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(280,78%,25%)"/><stop offset="1" stop-color="hsl(280,58%,55%)"/></linearGradient>
<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(0,78%,25%)"/><stop offset="1" stop-color="hsl(0,58%,55%)"/></linearGradient>
<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(200,78%,25%)"/><stop offset="1" stop-color="hsl(200,58%,55%)"/></linearGradient>
<linearGradient id="i4" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(130,78%,25%)"/><stop offset="1" stop-color="hsl(130,58%,55%)"/></linearGradient>
<marker id="i5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8699"/></marker>
</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="10" y="40" width="190" height="80" rx="12" fill="url(#i1)"/><text x="105" y="74" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">送信ボタン</text><text x="105" y="100" fill="#fff" font-size="13" text-anchor="middle">submit イベント</text>
<rect x="230" y="40" width="190" height="80" rx="12" fill="url(#i2)"/><text x="325" y="74" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">既定の送信を止める</text><text x="325" y="100" fill="#fff" font-size="13" text-anchor="middle">preventDefault()</text>
<rect x="450" y="40" width="190" height="80" rx="12" fill="url(#i3)"/><text x="545" y="74" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">値を集める</text><text x="545" y="100" fill="#fff" font-size="13" text-anchor="middle">new FormData(form)</text>
<rect x="670" y="40" width="200" height="80" rx="12" fill="url(#i4)"/><text x="770" y="74" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">確かめて使う</text><text x="770" y="100" fill="#fff" font-size="13" text-anchor="middle">変換 ・ 表示 ・ 通信（18 章）</text>
<line x1="202" y1="80" x2="226" y2="80" stroke="#7a8699" stroke-width="3" marker-end="url(#i5)"/>
<line x1="422" y1="80" x2="446" y2="80" stroke="#7a8699" stroke-width="3" marker-end="url(#i5)"/>
<line x1="642" y1="80" x2="666" y2="80" stroke="#7a8699" stroke-width="3" marker-end="url(#i5)"/>
<text x="440" y="155" fill="#4a5568" font-size="14" text-anchor="middle">Enter キーでの送信も submit イベントになるので、ボタンの click ではなく form の submit で受ける</text>
</svg>
