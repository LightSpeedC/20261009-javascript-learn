	<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="20" y="10" width="600" height="240" rx="16" fill="url(#i1)"/>
<text x="40" y="40" fill="#fff" font-size="17" font-weight="700">グローバル　appName = "メモ帳"</text>
<rect x="60" y="60" width="540" height="170" rx="14" fill="url(#i2)"/>
<text x="80" y="90" fill="#fff" font-size="17" font-weight="700">関数 outer　user = "user1"</text>
