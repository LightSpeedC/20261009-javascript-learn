<text x="120" y="140" fill="#fff" font-size="17" font-weight="700">関数 inner　page = "一覧"</text>
<text x="120" y="176" fill="#fff" font-size="15">console.log(appName, user, page)</text>
<path d="M600 160 C 660 160, 660 100, 620 80" fill="none" stroke="#b8620a" stroke-width="3" marker-end="url(#i4)"/>
<path d="M630 75 C 700 70, 700 40, 650 30" fill="none" stroke="#b8620a" stroke-width="3" marker-end="url(#i4)"/>
