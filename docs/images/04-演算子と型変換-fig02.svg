<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 210" width="880" height="210" role="img" aria-label="== と === の違い" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">
<defs>
<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(140,78%,25%)"/><stop offset="1" stop-color="hsl(140,58%,55%)"/></linearGradient>
<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(0,78%,25%)"/><stop offset="1" stop-color="hsl(0,58%,55%)"/></linearGradient>
<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(30,78%,25%)"/><stop offset="1" stop-color="hsl(30,58%,55%)"/></linearGradient>
<linearGradient id="i4" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(220,78%,25%)"/><stop offset="1" stop-color="hsl(220,58%,55%)"/></linearGradient>
<marker id="i5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8699"/></marker>
</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="34" fill="#1c2330" font-size="18" font-weight="700">1 === "1"</text>
<rect x="190" y="12" width="300" height="36" rx="8" fill="url(#i4)"/>
<text x="340" y="36" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">型が違う（number と string）</text>
<line x1="494" y1="30" x2="566" y2="30" stroke="#7a8699" stroke-width="3" marker-end="url(#i5)"/>
<rect x="570" y="12" width="140" height="36" rx="8" fill="url(#i2)"/>
<text x="640" y="36" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">false</text>
<text x="20" y="114" fill="#1c2330" font-size="18" font-weight="700">1 == "1"</text>
<rect x="190" y="92" width="300" height="36" rx="8" fill="url(#i3)"/>
<text x="340" y="116" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">"1" を数値の 1 に変える</text>
<line x1="494" y1="110" x2="566" y2="110" stroke="#7a8699" stroke-width="3" marker-end="url(#i5)"/>
<rect x="570" y="92" width="140" height="36" rx="8" fill="url(#i4)"/>
<text x="640" y="116" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">1 === 1</text>
<line x1="714" y1="110" x2="736" y2="110" stroke="#7a8699" stroke-width="3" marker-end="url(#i5)"/>
<rect x="740" y="92" width="120" height="36" rx="8" fill="url(#i1)"/>
<text x="800" y="116" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">true</text>
<text x="440" y="176" fill="#4a5568" font-size="15" text-anchor="middle">== は「変換してから ===」。変換の決まりが複雑で、思わぬ組み合わせが true になる</text>
</svg>
