<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 210" width="880" height="210" role="img" aria-label="コールバックの流れ" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">
<defs>
<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(70,78%,25%)"/><stop offset="1" stop-color="hsl(70,58%,55%)"/></linearGradient>
<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(25,78%,25%)"/><stop offset="1" stop-color="hsl(25,58%,55%)"/></linearGradient>
<marker id="i3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8699"/></marker>
</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="20" y="40" width="270" height="130" rx="14" fill="url(#i2)"/>
<text x="155" y="76" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">呼ぶ側</text>
<text x="155" y="108" fill="#fff" font-size="15" text-anchor="middle">repeat(3, 処理)</text>
<text x="155" y="136" fill="#fff" font-size="14" text-anchor="middle">「この処理を 3 回やって」</text>
<rect x="590" y="40" width="270" height="130" rx="14" fill="url(#i1)"/>
<text x="725" y="76" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">repeat の中</text>
<text x="725" y="108" fill="#fff" font-size="15" text-anchor="middle">action(1)</text>
<text x="725" y="132" fill="#fff" font-size="15" text-anchor="middle">action(2)</text>
<text x="725" y="156" fill="#fff" font-size="15" text-anchor="middle">action(3)</text>
<line x1="294" y1="80" x2="584" y2="80" stroke="#7a8699" stroke-width="3" marker-end="url(#i3)"/>
<text x="440" y="70" fill="#1c2330" font-size="15" font-weight="700" text-anchor="middle">関数を渡す</text>
<line x1="584" y1="135" x2="294" y2="135" stroke="#7a8699" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#i3)"/>
<text x="440" y="160" fill="#1c2330" font-size="15" font-weight="700" text-anchor="middle">都合のよいときに呼び返す（call back）</text>
</svg>
