<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" aria-label="+ の動きの決まり方" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">
<defs>
<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(224,78%,25%)"/><stop offset="1" stop-color="hsl(224,58%,55%)"/></linearGradient>
<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(25,78%,25%)"/><stop offset="1" stop-color="hsl(25,58%,55%)"/></linearGradient>
<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(140,78%,25%)"/><stop offset="1" stop-color="hsl(140,58%,55%)"/></linearGradient>
<marker id="i4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8699"/></marker>
</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="30" y="85" width="170" height="70" rx="12" fill="url(#i1)"/>
<text x="115" y="128" fill="#fff" font-size="22" font-weight="700" text-anchor="middle">a + b</text>
<line x1="204" y1="120" x2="266" y2="120" stroke="#7a8699" stroke-width="3" marker-end="url(#i4)"/>
<polygon points="400,40 530,120 400,200 270,120" fill="#ffffff" stroke="#7a8699" stroke-width="3"/>
<text x="400" y="113" fill="#1c2330" font-size="16" font-weight="700" text-anchor="middle">どちらかが</text>
<text x="400" y="137" fill="#1c2330" font-size="16" font-weight="700" text-anchor="middle">文字列？</text>
<line x1="510" y1="95" x2="596" y2="62" stroke="#7a8699" stroke-width="3" marker-end="url(#i4)"/>
<text x="548" y="66" fill="#b8620a" font-size="15" font-weight="700" text-anchor="middle">はい</text>
<line x1="510" y1="145" x2="596" y2="178" stroke="#7a8699" stroke-width="3" marker-end="url(#i4)"/>
<text x="548" y="186" fill="#1d7a3c" font-size="15" font-weight="700" text-anchor="middle">いいえ</text>
<rect x="600" y="20" width="260" height="84" rx="12" fill="url(#i2)"/>
<text x="730" y="52" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">文字列に変えて連結</text>
<text x="730" y="84" fill="#fff" font-size="16" text-anchor="middle">"1" + 2 → "12"</text>
<rect x="600" y="140" width="260" height="84" rx="12" fill="url(#i3)"/>
<text x="730" y="172" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">数値に変えて足し算</text>
<text x="730" y="204" fill="#fff" font-size="16" text-anchor="middle">1 + 2 → 3</text>
</svg>
