<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 190" width="860" height="190" role="img" aria-label="JavaScript の歩み" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">
<defs>
<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(280,78%,25%)"/><stop offset="1" stop-color="hsl(280,58%,55%)"/></linearGradient>
<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(210,78%,25%)"/><stop offset="1" stop-color="hsl(210,58%,55%)"/></linearGradient>
<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(140,78%,25%)"/><stop offset="1" stop-color="hsl(140,58%,55%)"/></linearGradient>
<linearGradient id="i4" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(35,78%,25%)"/><stop offset="1" stop-color="hsl(35,58%,55%)"/></linearGradient>
<linearGradient id="i5" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(0,78%,25%)"/><stop offset="1" stop-color="hsl(0,58%,55%)"/></linearGradient>
</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
<line x1="20" y1="122" x2="840" y2="122" stroke="#9aa6b8" stroke-width="4" stroke-linecap="round"/>
<rect x="20" y="30" width="150" height="62" rx="10" fill="url(#i1)"/>
<text x="95" y="56" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">ブラウザ用の</text>
<text x="95" y="78" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">言語として誕生</text>
<rect x="190" y="30" width="150" height="62" rx="10" fill="url(#i2)"/>
<text x="265" y="56" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">ECMAScript</text>
<text x="265" y="78" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">として標準化</text>
<rect x="360" y="30" width="150" height="62" rx="10" fill="url(#i3)"/>
<text x="435" y="56" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">Node.js 登場</text>
<text x="435" y="78" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">サーバーでも動く</text>
<rect x="530" y="30" width="150" height="62" rx="10" fill="url(#i4)"/>
<text x="605" y="56" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">ES2015 で</text>
<text x="605" y="78" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">大きく進化</text>
<rect x="700" y="30" width="140" height="62" rx="10" fill="url(#i5)"/>
<text x="770" y="56" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">毎年少しずつ</text>
<text x="770" y="78" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">機能を追加</text>
<circle cx="95" cy="122" r="8" fill="hsl(280,58%,55%)"/>
<circle cx="265" cy="122" r="8" fill="hsl(210,58%,55%)"/>
<circle cx="435" cy="122" r="8" fill="hsl(140,58%,55%)"/>
<circle cx="605" cy="122" r="8" fill="hsl(35,58%,55%)"/>
<circle cx="770" cy="122" r="8" fill="hsl(0,58%,55%)"/>
<text x="95" y="156" fill="#1c2330" font-size="16" font-weight="700" text-anchor="middle">1995</text>
<text x="265" y="156" fill="#1c2330" font-size="16" font-weight="700" text-anchor="middle">1997</text>
<text x="435" y="156" fill="#1c2330" font-size="16" font-weight="700" text-anchor="middle">2009</text>
<text x="605" y="156" fill="#1c2330" font-size="16" font-weight="700" text-anchor="middle">2015</text>
<text x="770" y="156" fill="#1c2330" font-size="16" font-weight="700" text-anchor="middle">2016〜</text>
<text x="605" y="180" fill="#4a5568" font-size="13" text-anchor="middle">let ・ const ・ class ・ Promise ・ アロー関数</text>
</svg>
