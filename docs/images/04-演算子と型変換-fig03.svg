<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="880" height="230" role="img" aria-label="falsy な値と truthy な値" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">
<defs>
<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(0,78%,25%)"/><stop offset="1" stop-color="hsl(0,58%,55%)"/></linearGradient>
<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(140,78%,25%)"/><stop offset="1" stop-color="hsl(140,58%,55%)"/></linearGradient>
</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="20" y="20" width="410" height="190" rx="16" fill="url(#i1)"/>
<text x="225" y="54" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">falsy（偽になる 8 つ）</text>
<text x="225" y="96" fill="#fff" font-size="19" text-anchor="middle">false　0　-0　0n</text>
<text x="225" y="134" fill="#fff" font-size="19" text-anchor="middle">""（空の文字列）</text>
<text x="225" y="172" fill="#fff" font-size="19" text-anchor="middle">null　undefined　NaN</text>
<rect x="450" y="20" width="410" height="190" rx="16" fill="url(#i2)"/>
<text x="655" y="54" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">truthy（それ以外すべて）</text>
<text x="655" y="96" fill="#fff" font-size="19" text-anchor="middle">"0"　"false"　" "（空白）</text>
<text x="655" y="134" fill="#fff" font-size="19" text-anchor="middle">[]（空の配列）　{}（空のオブジェクト）</text>
<text x="655" y="172" fill="#fff" font-size="19" text-anchor="middle">-1　Infinity　関数</text>
</svg>
