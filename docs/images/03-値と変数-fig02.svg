	<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="10" y="10" width="600" height="230" rx="14" fill="#eef1f7" stroke="#c9d1dc"/>
<text x="310" y="38" fill="#1c2330" font-size="17" font-weight="700" text-anchor="middle">プリミティブ（それ以上分けられない値）</text>
<rect x="30" y="56" width="135" height="76" rx="10" fill="url(#i2)"/><text x="97" y="88" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">number</text><text x="97" y="114" fill="#fff" font-size="14" text-anchor="middle">120 ・ 3.14</text>
<rect x="175" y="56" width="135" height="76" rx="10" fill="url(#i3)"/><text x="242" y="88" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">string</text><text x="242" y="114" fill="#fff" font-size="14" text-anchor="middle">"りんご"</text>
<rect x="320" y="56" width="135" height="76" rx="10" fill="url(#i4)"/><text x="387" y="88" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">boolean</text><text x="387" y="114" fill="#fff" font-size="14" text-anchor="middle">true ・ false</text>
<rect x="465" y="56" width="125" height="76" rx="10" fill="url(#i5)"/><text x="527" y="88" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">undefined</text><text x="527" y="114" fill="#fff" font-size="14" text-anchor="middle">未設定</text>
<rect x="30" y="146" width="135" height="76" rx="10" fill="url(#i6)"/><text x="97" y="178" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">null</text><text x="97" y="204" fill="#fff" font-size="14" text-anchor="middle">わざと空</text>
<rect x="175" y="146" width="135" height="76" rx="10" fill="url(#i7)"/><text x="242" y="178" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">bigint</text><text x="242" y="204" fill="#fff" font-size="14" text-anchor="middle">10n（巨大な整数）</text>
<rect x="320" y="146" width="135" height="76" rx="10" fill="url(#i8)"/><text x="387" y="178" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">symbol</text><text x="387" y="204" fill="#fff" font-size="14" text-anchor="middle">一意な目印</text>
<rect x="630" y="10" width="240" height="230" rx="14" fill="url(#i9)"/>
