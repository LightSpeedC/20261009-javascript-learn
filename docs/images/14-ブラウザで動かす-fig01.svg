<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" role="img" aria-label="HTML と CSS と JavaScript の役割" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">
<defs>
<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(15,78%,25%)"/><stop offset="1" stop-color="hsl(15,58%,55%)"/></linearGradient>
<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(215,78%,25%)"/><stop offset="1" stop-color="hsl(215,58%,55%)"/></linearGradient>
<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(50,78%,25%)"/><stop offset="1" stop-color="hsl(50,58%,55%)"/></linearGradient>
</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="20" y="20" width="260" height="180" rx="16" fill="url(#i1)"/>
<text x="150" y="60" fill="#fff" font-size="22" font-weight="700" text-anchor="middle">HTML</text>
<text x="150" y="96" fill="#fff" font-size="16" text-anchor="middle">骨組み</text>
<text x="150" y="134" fill="#fff" font-size="14" text-anchor="middle">見出し ・ 段落 ・ ボタン</text>
<text x="150" y="160" fill="#fff" font-size="14" text-anchor="middle">何がどこにあるか</text>
<rect x="310" y="20" width="260" height="180" rx="16" fill="url(#i2)"/>
<text x="440" y="60" fill="#fff" font-size="22" font-weight="700" text-anchor="middle">CSS</text>
<text x="440" y="96" fill="#fff" font-size="16" text-anchor="middle">見た目</text>
<text x="440" y="134" fill="#fff" font-size="14" text-anchor="middle">色 ・ 大きさ ・ 並べ方</text>
<text x="440" y="160" fill="#fff" font-size="14" text-anchor="middle">どう見せるか</text>
<rect x="600" y="20" width="260" height="180" rx="16" fill="url(#i3)"/>
<text x="730" y="60" fill="#fff" font-size="22" font-weight="700" text-anchor="middle">JavaScript</text>
<text x="730" y="96" fill="#fff" font-size="16" text-anchor="middle">動き</text>
<text x="730" y="134" fill="#fff" font-size="14" text-anchor="middle">押したら変える ・ 通信する</text>
<text x="730" y="160" fill="#fff" font-size="14" text-anchor="middle">いつ何をするか</text>
</svg>
