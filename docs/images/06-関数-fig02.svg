<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="880" height="230" role="img" aria-label="アロー関数を短くしていく手順" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">
<defs>
<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(280,78%,25%)"/><stop offset="1" stop-color="hsl(280,58%,55%)"/></linearGradient>
<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(180,78%,25%)"/><stop offset="1" stop-color="hsl(180,58%,55%)"/></linearGradient>
<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(80,78%,25%)"/><stop offset="1" stop-color="hsl(80,58%,55%)"/></linearGradient>
<marker id="i4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8699"/></marker>
</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="20" y="10" width="840" height="56" rx="10" fill="url(#i1)"/>
<text x="40" y="45" fill="#fff" font-size="19" font-family="Consolas, monospace">const triple = function (n) { return n * 3; };</text>
<text x="850" y="45" fill="#fff" font-size="14" text-anchor="end">関数式</text>
<line x1="440" y1="70" x2="440" y2="84" stroke="#7a8699" stroke-width="3" marker-end="url(#i4)"/>
<rect x="20" y="88" width="840" height="56" rx="10" fill="url(#i2)"/>
<text x="40" y="123" fill="#fff" font-size="19" font-family="Consolas, monospace">const triple = (n) =&gt; { return n * 3; };</text>
<text x="850" y="123" fill="#fff" font-size="14" text-anchor="end">function を =&gt; に</text>
<line x1="440" y1="148" x2="440" y2="162" stroke="#7a8699" stroke-width="3" marker-end="url(#i4)"/>
<rect x="20" y="166" width="840" height="56" rx="10" fill="url(#i3)"/>
<text x="40" y="201" fill="#fff" font-size="19" font-family="Consolas, monospace">const triple = (n) =&gt; n * 3;</text>
<text x="850" y="201" fill="#fff" font-size="14" text-anchor="end">本体が式 1 つなら { return } を省ける</text>
</svg>
