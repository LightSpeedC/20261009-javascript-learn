<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" role="img" aria-label="2 つの形式の歩み" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">
<defs>
<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(30,78%,25%)"/><stop offset="1" stop-color="hsl(30,58%,55%)"/></linearGradient>
<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(210,78%,25%)"/><stop offset="1" stop-color="hsl(210,58%,55%)"/></linearGradient>
<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(140,78%,25%)"/><stop offset="1" stop-color="hsl(140,58%,55%)"/></linearGradient>
</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
<line x1="20" y1="110" x2="860" y2="110" stroke="#9aa6b8" stroke-width="4" stroke-linecap="round"/>
<rect x="30" y="20" width="250" height="70" rx="12" fill="url(#i1)"/>
<text x="155" y="50" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">CommonJS</text>
<text x="155" y="76" fill="#fff" font-size="14" text-anchor="middle">Node.js が独自に採用</text>
<rect x="315" y="20" width="250" height="70" rx="12" fill="url(#i2)"/>
<text x="440" y="50" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">ES Modules</text>
<text x="440" y="76" fill="#fff" font-size="14" text-anchor="middle">言語仕様（ES2015）で決まる</text>
<rect x="600" y="20" width="250" height="70" rx="12" fill="url(#i3)"/>
<text x="725" y="50" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">両方が混ざって動く</text>
<text x="725" y="76" fill="#fff" font-size="14" text-anchor="middle">いまの Node.js</text>
<circle cx="155" cy="110" r="8" fill="hsl(30,58%,55%)"/><circle cx="440" cy="110" r="8" fill="hsl(210,58%,55%)"/><circle cx="725" cy="110" r="8" fill="hsl(140,58%,55%)"/>
<text x="155" y="142" fill="#1c2330" font-size="16" font-weight="700" text-anchor="middle">2009 〜</text>
<text x="440" y="142" fill="#1c2330" font-size="16" font-weight="700" text-anchor="middle">2015 〜</text>
<text x="725" y="142" fill="#1c2330" font-size="16" font-weight="700" text-anchor="middle">いま</text>
<text x="440" y="182" fill="#4a5568" font-size="14" text-anchor="middle">古いコードと npm のパッケージには CommonJS がたくさん残っている。新しく書くなら ES Modules</text>
</svg>
