<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" role="img" aria-label="try catch finally の流れ" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">
<defs>
<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(210,78%,25%)"/><stop offset="1" stop-color="hsl(210,58%,55%)"/></linearGradient>
<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(0,78%,25%)"/><stop offset="1" stop-color="hsl(0,58%,55%)"/></linearGradient>
<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(280,78%,25%)"/><stop offset="1" stop-color="hsl(280,58%,55%)"/></linearGradient>
<linearGradient id="i4" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(140,78%,25%)"/><stop offset="1" stop-color="hsl(140,58%,55%)"/></linearGradient>
<marker id="i5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8699"/></marker>
<marker id="i6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#a51f22"/></marker>
</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="20" y="20" width="220" height="120" rx="14" fill="url(#i1)"/>
<text x="130" y="50" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">try</text>
<text x="130" y="80" fill="#fff" font-size="14" text-anchor="middle">parsePrice("120") ✔</text>
<text x="130" y="106" fill="#fff" font-size="14" text-anchor="middle">parsePrice("百円") ✖</text>
<text x="130" y="130" fill="#fff" font-size="13" text-anchor="middle">この先は飛ばされる</text>
<rect x="320" y="20" width="220" height="120" rx="14" fill="url(#i2)"/>
<text x="430" y="50" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">catch (e)</text>
<text x="430" y="82" fill="#fff" font-size="14" text-anchor="middle">e にエラーが入る</text>
<text x="430" y="108" fill="#fff" font-size="14" text-anchor="middle">どうするか決める</text>
<rect x="620" y="20" width="240" height="120" rx="14" fill="url(#i3)"/>
<text x="740" y="50" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">finally</text>
<text x="740" y="82" fill="#fff" font-size="14" text-anchor="middle">必ず実行される</text>
<text x="740" y="108" fill="#fff" font-size="14" text-anchor="middle">後片付け</text>
<rect x="320" y="170" width="300" height="40" rx="10" fill="url(#i4)"/>
<text x="470" y="196" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">止まらずに次の処理へ</text>
<line x1="244" y1="100" x2="314" y2="100" stroke="#a51f22" stroke-width="3" marker-end="url(#i6)"/>
<text x="279" y="90" fill="#a51f22" font-size="13" font-weight="700" text-anchor="middle">エラー</text>
<line x1="544" y1="80" x2="614" y2="80" stroke="#7a8699" stroke-width="3" marker-end="url(#i5)"/>
<line x1="740" y1="144" x2="626" y2="186" stroke="#7a8699" stroke-width="3" marker-end="url(#i5)"/>
</svg>
