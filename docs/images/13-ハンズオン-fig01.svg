<rect x="190" y="40" width="150" height="80" rx="12" fill="url(#i2)"/><text x="265" y="74" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">parseCsv</text><text x="265" y="100" fill="#fff" font-size="13" text-anchor="middle">文字列 → 配列</text>
