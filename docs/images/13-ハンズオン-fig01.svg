<rect x="730" y="40" width="140" height="80" rx="12" fill="url(#i5)"/><text x="800" y="74" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">画面</text><text x="800" y="100" fill="#fff" font-size="13" text-anchor="middle">console.log</text>
