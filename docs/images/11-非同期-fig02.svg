<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="イベントループの仕組み" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">
<defs>
<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(233.3,78%,25%)"/><stop offset="1" stop-color="hsl(233.3,58%,55%)"/></linearGradient>
<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(25,78%,25%)"/><stop offset="1" stop-color="hsl(25,58%,55%)"/></linearGradient>
<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(330,78%,25%)"/><stop offset="1" stop-color="hsl(330,58%,55%)"/></linearGradient>
<linearGradient id="i4" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(200,78%,25%)"/><stop offset="1" stop-color="hsl(200,58%,55%)"/></linearGradient>
<marker id="i5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8699"/></marker>
</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="20" y="20" width="250" height="260" rx="14" fill="url(#i1)"/>
<text x="145" y="52" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">いま実行中の処理</text>
<text x="145" y="80" fill="#fff" font-size="14" text-anchor="middle">（コールスタック）</text>
<text x="145" y="130" fill="#fff" font-size="15" text-anchor="middle">上から順に 1 行ずつ</text>
<text x="145" y="160" fill="#fff" font-size="15" text-anchor="middle">終わるまで割り込めない</text>
<rect x="330" y="20" width="230" height="110" rx="14" fill="url(#i4)"/>
<text x="445" y="52" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">裏で進む待ち</text>
<text x="445" y="82" fill="#fff" font-size="14" text-anchor="middle">タイマー ・ ファイル</text>
<text x="445" y="106" fill="#fff" font-size="14" text-anchor="middle">通信 …</text>
<rect x="620" y="20" width="240" height="110" rx="14" fill="url(#i3)"/>
<text x="740" y="52" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">① マイクロタスク</text>
<text x="740" y="82" fill="#fff" font-size="14" text-anchor="middle">Promise の then ・ await の続き</text>
<text x="740" y="106" fill="#fff" font-size="14" text-anchor="middle">先に全部片付ける</text>
<rect x="620" y="170" width="240" height="110" rx="14" fill="url(#i2)"/>
<text x="740" y="202" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">② タスクの列</text>
<text x="740" y="232" fill="#fff" font-size="14" text-anchor="middle">時間になったタイマー</text>
<text x="740" y="256" fill="#fff" font-size="14" text-anchor="middle">読み終わったファイル …</text>
<line x1="274" y1="75" x2="324" y2="75" stroke="#7a8699" stroke-width="3" marker-end="url(#i5)"/>
<text x="299" y="66" fill="#1c2330" font-size="12" text-anchor="middle">頼む</text>
<line x1="564" y1="110" x2="660" y2="166" stroke="#7a8699" stroke-width="3" marker-end="url(#i5)"/>
<path d="M616 75 C 450 180, 400 230, 278 230" fill="none" stroke="#b8620a" stroke-width="3" marker-end="url(#i5)"/>
<path d="M616 250 C 500 280, 380 280, 278 262" fill="none" stroke="#b8620a" stroke-width="3" marker-end="url(#i5)"/>
<text x="440" y="210" fill="#b8620a" font-size="14" font-weight="700" text-anchor="middle">手が空いたら、① → ② の順に 1 つずつ取り出して実行</text>
</svg>
