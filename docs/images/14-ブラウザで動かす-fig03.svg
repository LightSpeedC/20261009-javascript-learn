<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" role="img" aria-label="file と http の違い" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">
<defs>
<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(0,78%,25%)"/><stop offset="1" stop-color="hsl(0,58%,55%)"/></linearGradient>
<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(140,78%,25%)"/><stop offset="1" stop-color="hsl(140,58%,55%)"/></linearGradient>
<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(0,78%,25%)"/><stop offset="1" stop-color="hsl(0,58%,55%)"/></linearGradient>
<marker id="i4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8699"/></marker>
</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="20" y="20" width="400" height="70" rx="12" fill="url(#i1)"/>
<text x="220" y="50" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">ダブルクリックで開く</text>
<text x="220" y="76" fill="#fff" font-size="14" text-anchor="middle">file:///…/index.html → module が読めない</text>
<rect x="20" y="110" width="400" height="70" rx="12" fill="url(#i2)"/>
<text x="220" y="140" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">ローカルサーバから開く</text>
<text x="220" y="166" fill="#fff" font-size="14" text-anchor="middle">http://localhost:8080/ → 読める</text>
<rect x="560" y="110" width="300" height="70" rx="12" fill="url(#i3)"/>
<text x="710" y="140" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">node serve.mjs</text>
<text x="710" y="166" fill="#fff" font-size="14" text-anchor="middle">フォルダの中身を返すだけ</text>
<line x1="556" y1="145" x2="426" y2="145" stroke="#7a8699" stroke-width="3" marker-end="url(#i4)"/>
</svg>
