<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" width="860" height="250" role="img" aria-label="言語と実行環境の関係" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">
<defs>
<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(186.7,78%,25%)"/><stop offset="1" stop-color="hsl(186.7,58%,55%)"/></linearGradient>
<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(25,78%,25%)"/><stop offset="1" stop-color="hsl(25,58%,55%)"/></linearGradient>
<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(130,78%,25%)"/><stop offset="1" stop-color="hsl(130,58%,55%)"/></linearGradient>
</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="30" y="20" width="380" height="120" rx="12" fill="url(#i2)"/>
<text x="220" y="52" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">ブラウザ（Chrome ・ Edge など）</text>
<text x="220" y="84" fill="#fff" font-size="15" text-anchor="middle">画面の部品（DOM）・クリックなどのイベント</text>
<text x="220" y="108" fill="#fff" font-size="15" text-anchor="middle">通信（fetch）・保存（localStorage）</text>
<text x="220" y="130" fill="#fff" font-size="13" text-anchor="middle">→ 第2部で扱う</text>
<rect x="450" y="20" width="380" height="120" rx="12" fill="url(#i3)"/>
<text x="640" y="52" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">Node.js</text>
<text x="640" y="84" fill="#fff" font-size="15" text-anchor="middle">ファイルの読み書き・フォルダの一覧</text>
<text x="640" y="108" fill="#fff" font-size="15" text-anchor="middle">コマンドラインのツール・Web サーバー</text>
<text x="640" y="130" fill="#fff" font-size="13" text-anchor="middle">→ 第1部の実行環境</text>
<rect x="30" y="160" width="800" height="70" rx="12" fill="url(#i1)"/>
<text x="430" y="192" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">ECMAScript（言語そのもの）</text>
<text x="430" y="216" fill="#fff" font-size="15" text-anchor="middle">変数 ・ 型 ・ 関数 ・ オブジェクト ・ クラス ・ Promise … どちらでも同じに動く</text>
</svg>
