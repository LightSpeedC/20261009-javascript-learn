<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" role="img" aria-label="エラーの種類" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">
<defs>
<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(210,78%,25%)"/><stop offset="1" stop-color="hsl(210,58%,55%)"/></linearGradient>
<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(280,78%,25%)"/><stop offset="1" stop-color="hsl(280,58%,55%)"/></linearGradient>
<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(200,78%,25%)"/><stop offset="1" stop-color="hsl(200,58%,55%)"/></linearGradient>
<linearGradient id="i4" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(120,78%,25%)"/><stop offset="1" stop-color="hsl(120,58%,55%)"/></linearGradient>
<linearGradient id="i5" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(40,78%,25%)"/><stop offset="1" stop-color="hsl(40,58%,55%)"/></linearGradient>
<linearGradient id="i6" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(0,78%,25%)"/><stop offset="1" stop-color="hsl(0,58%,55%)"/></linearGradient>
</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="340" y="10" width="200" height="50" rx="10" fill="url(#i1)"/>
<text x="440" y="42" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">Error</text>
<g stroke="#9aa6b8" stroke-width="3">
<line x1="440" y1="60" x2="440" y2="90"/><line x1="95" y1="90" x2="785" y2="90"/>
<line x1="95" y1="90" x2="95" y2="112"/><line x1="268" y1="90" x2="268" y2="112"/><line x1="440" y1="90" x2="440" y2="112"/><line x1="612" y1="90" x2="612" y2="112"/><line x1="785" y1="90" x2="785" y2="112"/>
</g>
<rect x="15" y="112" width="160" height="76" rx="10" fill="url(#i2)"/><text x="95" y="142" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">TypeError</text><text x="95" y="168" fill="#fff" font-size="13" text-anchor="middle">型が合わない操作</text>
<rect x="188" y="112" width="160" height="76" rx="10" fill="url(#i3)"/><text x="268" y="142" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">ReferenceError</text><text x="268" y="168" fill="#fff" font-size="13" text-anchor="middle">無い名前を使った</text>
<rect x="360" y="112" width="160" height="76" rx="10" fill="url(#i4)"/><text x="440" y="142" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">SyntaxError</text><text x="440" y="168" fill="#fff" font-size="13" text-anchor="middle">書き方の誤り</text>
<rect x="532" y="112" width="160" height="76" rx="10" fill="url(#i5)"/><text x="612" y="142" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">RangeError</text><text x="612" y="168" fill="#fff" font-size="13" text-anchor="middle">範囲の外の値</text>
<rect x="705" y="112" width="160" height="76" rx="10" fill="url(#i6)"/><text x="785" y="142" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">自作のエラー</text><text x="785" y="168" fill="#fff" font-size="13" text-anchor="middle">extends Error</text>
</svg>
