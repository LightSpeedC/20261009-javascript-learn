<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" role="img" aria-label="関数の各部の名前" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">
<defs>
<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(280,78%,25%)"/><stop offset="1" stop-color="hsl(280,58%,55%)"/></linearGradient>
<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(210,78%,25%)"/><stop offset="1" stop-color="hsl(210,58%,55%)"/></linearGradient>
<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(140,78%,25%)"/><stop offset="1" stop-color="hsl(140,58%,55%)"/></linearGradient>
<linearGradient id="i4" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(25,78%,25%)"/><stop offset="1" stop-color="hsl(25,58%,55%)"/></linearGradient>
</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="20" y="70" width="840" height="60" rx="10" fill="#f4f6fa" stroke="#c9d1dc"/>
<text x="40" y="109" fill="#17335f" font-size="22" font-family="Consolas, monospace">function add(a, b) { return a + b; }</text>
<rect x="146" y="80" width="42" height="40" rx="6" fill="none" stroke="hsl(280,58%,55%)" stroke-width="3"/>
<rect x="183" y="80" width="77" height="40" rx="6" fill="none" stroke="hsl(210,58%,55%)" stroke-width="3"/>
<rect x="266" y="76" width="214" height="48" rx="6" fill="none" stroke="hsl(140,58%,55%)" stroke-width="3"/>
<rect x="374" y="84" width="70" height="32" rx="6" fill="none" stroke="hsl(25,58%,55%)" stroke-width="3" stroke-dasharray="5 4"/>
<rect x="100" y="10" width="150" height="40" rx="8" fill="url(#i1)"/><text x="175" y="36" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">名前</text>
<rect x="260" y="10" width="150" height="40" rx="8" fill="url(#i2)"/><text x="335" y="36" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">引数（受け取る）</text>
<rect x="300" y="150" width="200" height="40" rx="8" fill="url(#i3)"/><text x="400" y="176" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">本体（{ } の中）</text>
<rect x="520" y="150" width="240" height="40" rx="8" fill="url(#i4)"/><text x="640" y="176" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">戻り値（return の後ろ）</text>
<line x1="170" y1="50" x2="167" y2="80" stroke="hsl(280,58%,55%)" stroke-width="3"/>
<line x1="320" y1="50" x2="222" y2="80" stroke="hsl(210,58%,55%)" stroke-width="3"/>
<line x1="380" y1="150" x2="340" y2="124" stroke="hsl(140,58%,55%)" stroke-width="3"/>
<line x1="600" y1="150" x2="410" y2="116" stroke="hsl(25,58%,55%)" stroke-width="3"/>
</svg>
