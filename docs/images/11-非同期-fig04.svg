<text x="800" y="33" fill="#a51f22" font-size="14" font-weight="700">0.8 秒</text>
<text x="20" y="100" fill="#1c2330" font-size="16" font-weight="700">同時に（Promise.all）</text>
<rect x="230" y="70" width="280" height="30" rx="6" fill="url(#i1)"/><text x="370" y="91" fill="#fff" font-size="14" text-anchor="middle">C（0.4 秒）</text>
<rect x="230" y="104" width="280" height="30" rx="6" fill="url(#i2)"/><text x="370" y="125" fill="#fff" font-size="14" text-anchor="middle">D（0.4 秒）</text>
<text x="520" y="110" fill="#1d7a3c" font-size="14" font-weight="700">0.4 秒</text>
<line x1="230" y1="150" x2="792" y2="150" stroke="#9aa6b8" stroke-width="2"/>
<text x="230" y="166" fill="#4a5568" font-size="12">0</text><text x="505" y="166" fill="#4a5568" font-size="12">0.4</text><text x="785" y="166" fill="#4a5568" font-size="12">0.8 秒</text>
