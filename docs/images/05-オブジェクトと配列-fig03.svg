<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 210" width="880" height="210" role="img" aria-label="map filter reduce の流れ" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">
<defs>
<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(280,78%,25%)"/><stop offset="1" stop-color="hsl(280,58%,55%)"/></linearGradient>
<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(200,78%,25%)"/><stop offset="1" stop-color="hsl(200,58%,55%)"/></linearGradient>
<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(120,78%,25%)"/><stop offset="1" stop-color="hsl(120,58%,55%)"/></linearGradient>
<linearGradient id="i4" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(30,78%,25%)"/><stop offset="1" stop-color="hsl(30,58%,55%)"/></linearGradient>
<marker id="i5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8699"/></marker>
</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
<g font-size="15" fill="#1c2330" text-anchor="middle">
<text x="110" y="24" font-weight="700">元の配列</text>
<text x="330" y="24" font-weight="700">map（変える）</text>
<text x="550" y="24" font-weight="700">filter（選ぶ）</text>
<text x="770" y="24" font-weight="700">reduce（まとめる）</text>
</g>
<rect x="30" y="40" width="160" height="40" rx="8" fill="url(#i1)"/><text x="110" y="66" fill="#fff" font-size="15" text-anchor="middle">りんご 120</text>
<rect x="30" y="90" width="160" height="40" rx="8" fill="url(#i1)"/><text x="110" y="116" fill="#fff" font-size="15" text-anchor="middle">メロン 980</text>
<rect x="30" y="140" width="160" height="40" rx="8" fill="url(#i1)"/><text x="110" y="166" fill="#fff" font-size="15" text-anchor="middle">みかん 80</text>
<rect x="250" y="40" width="160" height="40" rx="8" fill="url(#i2)"/><text x="330" y="66" fill="#fff" font-size="15" text-anchor="middle">132（税込）</text>
<rect x="250" y="90" width="160" height="40" rx="8" fill="url(#i2)"/><text x="330" y="116" fill="#fff" font-size="15" text-anchor="middle">1078（税込）</text>
<rect x="250" y="140" width="160" height="40" rx="8" fill="url(#i2)"/><text x="330" y="166" fill="#fff" font-size="15" text-anchor="middle">88（税込）</text>
<rect x="470" y="40" width="160" height="40" rx="8" fill="url(#i3)"/><text x="550" y="66" fill="#fff" font-size="15" text-anchor="middle">132</text>
<rect x="470" y="90" width="160" height="40" rx="8" fill="#e3e7ee"/><text x="550" y="116" fill="#7a8699" font-size="15" text-anchor="middle">1078（外れる）</text>
<rect x="470" y="140" width="160" height="40" rx="8" fill="url(#i3)"/><text x="550" y="166" fill="#fff" font-size="15" text-anchor="middle">88</text>
<rect x="690" y="90" width="160" height="40" rx="8" fill="url(#i4)"/><text x="770" y="116" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">合計 220</text>
<line x1="194" y1="110" x2="244" y2="110" stroke="#7a8699" stroke-width="3" marker-end="url(#i5)"/>
<line x1="414" y1="110" x2="464" y2="110" stroke="#7a8699" stroke-width="3" marker-end="url(#i5)"/>
<line x1="634" y1="110" x2="684" y2="110" stroke="#7a8699" stroke-width="3" marker-end="url(#i5)"/>
<text x="440" y="202" fill="#4a5568" font-size="14" text-anchor="middle">税込にする → 200 円未満を選ぶ → 合計する。どのメソッドも元の配列を変えず、新しい結果を返す</text>
</svg>
