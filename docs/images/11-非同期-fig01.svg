<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" aria-label="同期と非同期の違い" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">
<defs>
<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(280,78%,25%)"/><stop offset="1" stop-color="hsl(280,58%,55%)"/></linearGradient>
<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(0,78%,25%)"/><stop offset="1" stop-color="hsl(0,58%,55%)"/></linearGradient>
<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(200,78%,25%)"/><stop offset="1" stop-color="hsl(200,58%,55%)"/></linearGradient>
<linearGradient id="i4" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(130,78%,25%)"/><stop offset="1" stop-color="hsl(130,58%,55%)"/></linearGradient>
</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="30" fill="#1c2330" font-size="17" font-weight="700">待つ書き方（同期）: 料理ができるまで、次の注文を受けない</text>
<rect x="20" y="44" width="150" height="40" rx="8" fill="url(#i1)"/><text x="95" y="70" fill="#fff" font-size="15" text-anchor="middle">注文 1</text>
<rect x="172" y="44" width="330" height="40" rx="8" fill="url(#i2)"/><text x="337" y="70" fill="#fff" font-size="15" text-anchor="middle">料理を待つ（何もできない）</text>
<rect x="504" y="44" width="150" height="40" rx="8" fill="url(#i1)"/><text x="579" y="70" fill="#fff" font-size="15" text-anchor="middle">注文 2</text>
<text x="20" y="140" fill="#1c2330" font-size="17" font-weight="700">待たない書き方（非同期）: 頼んだら次へ。できたら呼ばれる</text>
<rect x="20" y="154" width="150" height="40" rx="8" fill="url(#i1)"/><text x="95" y="180" fill="#fff" font-size="15" text-anchor="middle">注文 1</text>
<rect x="172" y="154" width="150" height="40" rx="8" fill="url(#i1)"/><text x="247" y="180" fill="#fff" font-size="15" text-anchor="middle">注文 2</text>
<rect x="324" y="154" width="150" height="40" rx="8" fill="url(#i1)"/><text x="399" y="180" fill="#fff" font-size="15" text-anchor="middle">注文 3</text>
<rect x="172" y="202" width="330" height="30" rx="8" fill="url(#i3)"/><text x="337" y="223" fill="#fff" font-size="14" text-anchor="middle">料理 1 は裏で進んでいる</text>
<rect x="504" y="154" width="200" height="40" rx="8" fill="url(#i4)"/><text x="604" y="180" fill="#fff" font-size="15" text-anchor="middle">料理 1 ができた → 出す</text>
</svg>
