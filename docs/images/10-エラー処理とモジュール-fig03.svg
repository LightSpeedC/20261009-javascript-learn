<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="880" height="230" role="img" aria-label="export と import" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">
<defs>
<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(200,78%,25%)"/><stop offset="1" stop-color="hsl(200,58%,55%)"/></linearGradient>
<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(30,78%,25%)"/><stop offset="1" stop-color="hsl(30,58%,55%)"/></linearGradient>
<marker id="i3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8699"/></marker>
</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="20" y="20" width="360" height="190" rx="16" fill="url(#i1)"/>
<text x="200" y="52" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">math.mjs</text>
<text x="44" y="90" fill="#fff" font-size="15">export const TAX_RATE</text>
<text x="44" y="120" fill="#fff" font-size="15">export function withTax</text>
<text x="44" y="150" fill="#fff" font-size="15">export default formatYen</text>
<text x="44" y="186" fill="#fff" font-size="13">export を付けないものは、外から見えない</text>
<rect x="500" y="20" width="360" height="190" rx="16" fill="url(#i2)"/>
<text x="680" y="52" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">main.mjs</text>
<text x="524" y="90" fill="#fff" font-size="15">import formatYen,</text>
<text x="524" y="120" fill="#fff" font-size="15">  { TAX_RATE, withTax }</text>
<text x="524" y="150" fill="#fff" font-size="15">  from "./math.mjs";</text>
<text x="524" y="186" fill="#fff" font-size="13">使う名前を選んで取り込む</text>
<line x1="384" y1="115" x2="494" y2="115" stroke="#7a8699" stroke-width="4" marker-end="url(#i3)"/>
</svg>
