<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 210" width="880" height="210" role="img" aria-label="変数は値に付けた名札" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">
<defs>
<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(280,78%,25%)"/><stop offset="1" stop-color="hsl(280,58%,55%)"/></linearGradient>
<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(150,78%,25%)"/><stop offset="1" stop-color="hsl(150,58%,55%)"/></linearGradient>
<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(30,78%,25%)"/><stop offset="1" stop-color="hsl(30,58%,55%)"/></linearGradient>
<linearGradient id="i4" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(200,78%,25%)"/><stop offset="1" stop-color="hsl(200,58%,55%)"/></linearGradient>
<marker id="i5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7a8699"/></marker>
</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
<text x="220" y="28" fill="#1c2330" font-size="17" font-weight="700" text-anchor="middle">const price = 120;</text>
<rect x="40" y="50" width="140" height="56" rx="28" fill="url(#i1)"/>
<text x="110" y="85" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">price</text>
<line x1="184" y1="78" x2="266" y2="78" stroke="#7a8699" stroke-width="3" marker-end="url(#i5)"/>
<rect x="270" y="50" width="130" height="56" rx="10" fill="url(#i2)"/>
<text x="335" y="85" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">120</text>
<text x="220" y="140" fill="#a51f22" font-size="15" font-weight="700" text-anchor="middle">price = 150; → エラー（付け替えできない）</text>
<text x="660" y="28" fill="#1c2330" font-size="17" font-weight="700" text-anchor="middle">let count = 0;  count = 1;</text>
<rect x="480" y="50" width="140" height="56" rx="28" fill="url(#i3)"/>
<text x="550" y="85" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">count</text>
<rect x="710" y="30" width="130" height="50" rx="10" fill="#c9d1dc"/>
<text x="775" y="62" fill="#4a5568" font-size="20" font-weight="700" text-anchor="middle">0</text>
<rect x="710" y="110" width="130" height="56" rx="10" fill="url(#i4)"/>
<text x="775" y="145" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">1</text>
<line x1="624" y1="70" x2="704" y2="55" stroke="#c0c8d4" stroke-width="3" stroke-dasharray="6 5"/>
<line x1="624" y1="88" x2="704" y2="130" stroke="#7a8699" stroke-width="3" marker-end="url(#i5)"/>
<text x="660" y="196" fill="#1d7a3c" font-size="15" font-weight="700" text-anchor="middle">let は名札を別の値へ付け替えられる</text>
</svg>
