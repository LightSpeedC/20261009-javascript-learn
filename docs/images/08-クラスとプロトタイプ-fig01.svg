<text x="165" y="154" fill="#fff" font-size="15" text-anchor="middle">describe()</text>
<line x1="314" y1="80" x2="520" y2="56" stroke="#7a8699" stroke-width="3" marker-end="url(#i4)"/>
<line x1="314" y1="130" x2="520" y2="154" stroke="#7a8699" stroke-width="3" marker-end="url(#i4)"/>
<text x="420" y="60" fill="#1c2330" font-size="15" font-weight="700" text-anchor="middle">new Item("りんご", 120)</text>
