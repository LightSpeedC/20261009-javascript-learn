<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" role="img" aria-label="var と let の巻き上げの違い" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">
<defs>
<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(30,78%,25%)"/><stop offset="1" stop-color="hsl(30,58%,55%)"/></linearGradient>
<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(200,78%,25%)"/><stop offset="1" stop-color="hsl(200,58%,55%)"/></linearGradient>
</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="20" y="10" width="410" height="200" rx="14" fill="url(#i1)"/>
<text x="225" y="40" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">var</text>
<rect x="40" y="56" width="370" height="34" rx="6" fill="rgba(255,255,255,0.18)" stroke="#fff" stroke-dasharray="5 4"/>
<text x="56" y="79" fill="#fff" font-size="15" font-family="Consolas, monospace">var a;  ← 先頭で作られる（中身は undefined）</text>
<text x="56" y="120" fill="#fff" font-size="15" font-family="Consolas, monospace">console.log(a);  → undefined</text>
<text x="56" y="150" fill="#fff" font-size="15" font-family="Consolas, monospace">a = 1;</text>
<text x="56" y="180" fill="#fff" font-size="15" font-family="Consolas, monospace">console.log(a);  → 1</text>
<rect x="450" y="10" width="410" height="200" rx="14" fill="url(#i2)"/>
<text x="655" y="40" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">let ・ const</text>
<rect x="470" y="56" width="370" height="78" rx="6" fill="rgba(255,255,255,0.18)" stroke="#fff" stroke-dasharray="5 4"/>
<text x="486" y="79" fill="#fff" font-size="15">ここは「一時的な使用禁止区間」</text>
<text x="486" y="105" fill="#fff" font-size="15" font-family="Consolas, monospace">console.log(b);  → エラー</text>
<text x="486" y="160" fill="#fff" font-size="15" font-family="Consolas, monospace">let b = 2;  ← ここから使える</text>
<text x="486" y="190" fill="#fff" font-size="15" font-family="Consolas, monospace">console.log(b);  → 2</text>
</svg>
